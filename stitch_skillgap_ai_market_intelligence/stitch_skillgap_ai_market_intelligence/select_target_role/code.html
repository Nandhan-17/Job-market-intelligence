<style>
        body {
            background-color: #0f172a;
            color: #d4e4fa;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);

<body class="antialiased min-h-screen flex flex-col pt-16">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-white/10 shadow-sm flex items-center justify-between px-gutter h-16 z-50">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="bubble_chart">bubble_chart</span>
<span class="font-display-lg text-headline-md-mobile font-bold text-secondary tracking-tight">SkillPulse</span>
</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-150 p-2 rounded-full text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<main class="flex-1 container mx-auto px-4 sm:px-6 lg:px-8 max-w-4xl py-xl pb-32">
<div class="mb-lg">
<h1 class="font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md text-on-surface mb-sm">Set your career target</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Select a role to analyze required skills and current market demand.</p>
</div>
<!-- Search -->
<div class="relative mb-xl">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full bg-[#0F172A] border border-slate-700 rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-0 glass-input transition-all duration-200 font-body-base text-body-base" placeholder="Search roles (e.g. Data Scientist)..." type="text"/>
</div>
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-md tracking-wider">RECOMMENDED FOR YOU</h2>
<!-- Role Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md mb-xl">
<!-- Card 1 -->
<label class="relative group cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="data-scientist"/>
<div class="glass-panel p-md rounded-xl transition-all duration-200 peer-checked:border-[#2DD4BF] peer-checked:bg-[rgba(45,212,191,0.05)] hover:bg-[rgba(255,255,255,0.02)] h-full flex flex-col">
<div class="flex justify-between items-start mb-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#2DD4BF]" data-icon="query_stats">query_stats</span>
<h3 class="font-headline-md-mobile text-headline-md-mobile !text-[20px] text-on-surface font-semibold">Data Scientist</h3>
</div>
<span class="bg-[#2DD4BF]/10 text-[#2DD4BF] font-data-mono text-data-mono !text-[10px] px-2 py-1 rounded-sm border border-[#2DD4BF]/20 flex items-center gap-1">
<span class="material-symbols-outlined !text-[12px]" data-icon="trending_up">trending_up</span> High Demand
                        </span>
</div>
<p class="font-body-base text-body-base !text-[14px] text-on-surface-variant mb-md flex-1">Analyze complex datasets to build predictive models and drive strategic decisions.</p>
<div class="flex gap-2 mt-auto">
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Python</span>
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Machine Learning</span>
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">SQL</span>
</div>
<div class="absolute inset-0 border-2 border-transparent rounded-xl peer-checked:border-[#2DD4BF] pointer-events-none transition-colors"></div>
<div class="absolute top-4 right-4 w-5 h-5 rounded-full border border-slate-600 peer-checked:border-[#2DD4BF] flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
<div class="w-2.5 h-2.5 rounded-full bg-[#2DD4BF] scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- Card 2 -->
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="software-engineer"/>
<div class="glass-panel p-md rounded-xl transition-all duration-200 peer-checked:border-[#2DD4BF] peer-checked:bg-[rgba(45,212,191,0.05)] hover:bg-[rgba(255,255,255,0.02)] h-full flex flex-col">
<div class="flex justify-between items-start mb-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="code">code</span>
<h3 class="font-headline-md-mobile text-headline-md-mobile !text-[20px] text-on-surface font-semibold">Software Engineer</h3>
</div>
</div>
<p class="font-body-base text-body-base !text-[14px] text-on-surface-variant mb-md flex-1">Design, develop, and maintain robust software applications and systems.</p>
<div class="flex gap-2 mt-auto">
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Java</span>
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">System Design</span>
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Cloud</span>
</div>
<div class="absolute inset-0 border-2 border-transparent rounded-xl peer-checked:border-[#2DD4BF] pointer-events-none transition-colors"></div>
</div>
</label>
<!-- Card 3 -->
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="ux-designer"/>
<div class="glass-panel ai-glow p-md rounded-xl transition-all duration-200 peer-checked:border-[#2DD4BF] peer-checked:bg-[rgba(45,212,191,0.05)] hover:bg-[rgba(255,255,255,0.02)] h-full flex flex-col relative overflow-hidden">
<div class="flex justify-between items-start mb-sm relative z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="brush">brush</span>
<h3 class="font-headline-md-mobile text-headline-md-mobile !text-[20px] text-on-surface font-semibold">UX Designer</h3>
</div>
<span class="bg-indigo-500/20 text-indigo-300 font-data-mono text-data-mono !text-[10px] px-2 py-1 rounded-sm border border-indigo-500/30 flex items-center gap-1">
<span class="material-symbols-outlined !text-[12px]" data-icon="auto_awesome">auto_awesome</span> Trending Match
                        </span>
</div>
<p class="font-body-base text-body-base !text-[14px] text-on-surface-variant mb-md flex-1 relative z-10">Craft intuitive and engaging user experiences through research and prototyping.</p>
<div class="flex gap-2 mt-auto relative z-10">
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Figma</span>
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">User Research</span>
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Prototyping</span>
</div>
<div class="absolute inset-0 border-2 border-transparent rounded-xl peer-checked:border-[#2DD4BF] pointer-events-none transition-colors z-20"></div>
</div>
</label>
<!-- Card 4 -->
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="product-manager"/>
<div class="glass-panel p-md rounded-xl transition-all duration-200 peer-checked:border-[#2DD4BF] peer-checked:bg-[rgba(45,212,191,0.05)] hover:bg-[rgba(255,255,255,0.02)] h-full flex flex-col">
<div class="flex justify-between items-start mb-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="account_tree">account_tree</span>
<h3 class="font-headline-md-mobile text-headline-md-mobile !text-[20px] text-on-surface font-semibold">Product Manager</h3>
</div>
</div>
<p class="font-body-base text-body-base !text-[14px] text-on-surface-variant mb-md flex-1">Guide product strategy, prioritize features, and coordinate cross-functional teams.</p>
<div class="flex gap-2 mt-auto">
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Agile</span>
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Strategy</span>
<span class="font-label-caps text-label-caps !text-[10px] bg-surface-container py-1 px-2 rounded text-on-surface-variant border border-white/5">Analytics</span>
</div>
<div class="absolute inset-0 border-2 border-transparent rounded-xl peer-checked:border-[#2DD4BF] pointer-events-none transition-colors"></div>
</div>
</label>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-lg border-t border-white/5 p-4 md:px-8 md:py-6 shadow-2xl z-40">
<div class="max-w-4xl mx-auto flex justify-end">
<button class="bg-[#2DD4BF] text-[#0F172A] hover:brightness-110 active:scale-95 transition-all duration-150 font-label-caps text-label-caps px-8 py-3 rounded-lg font-bold tracking-wider flex items-center gap-2">
                NEXT <span class="material-symbols-outlined !text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
