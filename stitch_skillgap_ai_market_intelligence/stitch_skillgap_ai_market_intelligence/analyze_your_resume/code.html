<style>
        .ai-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(45, 212, 191, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(45, 212, 191, 0);
            }
        }
        
        .glass-panel {
            background: rgba(5, 20, 36, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .dashed-border-glow {
            border: 2px dashed rgba(45, 212, 191, 0.3);
            transition: all 0.3s ease;
        }
        
        .dashed-border-glow:hover {
            border-color: rgba(45, 212, 191, 0.8);
            box-shadow: inset 0 0 20px rgba(45, 212, 191, 0.1);
            background: rgba(45, 212, 191, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-base overflow-x-hidden pt-16">
<!-- TopAppBar (Transactional - Hidden Nav shell, keeping header for context) -->
<header class="fixed top-0 w-full bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-white/10 shadow-sm flex items-center justify-between px-gutter h-16 z-50">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" data-icon="bubble_chart">bubble_chart</span>
<span class="font-display-lg text-headline-md-mobile font-bold text-secondary tracking-tight">SkillPulse</span>
</div>
<a class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-150 flex items-center gap-2" href="#">
<span class="font-label-caps text-label-caps uppercase">Cancel</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</a>
</header>
<main class="flex-grow flex flex-col items-center justify-center p-container-margin md:p-xl w-full max-w-4xl mx-auto">
<div class="w-full glass-panel rounded-xl p-lg md:p-xl flex flex-col items-center text-center relative overflow-hidden">
<!-- AI Pulse Background Effect -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-tertiary-container/30 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-secondary-container/20 rounded-full blur-[80px] pointer-events-none"></div>
<div class="mb-md">
<h1 class="font-headline-md text-headline-md mb-sm text-on-surface">Initialize AI Scan</h1>
<p class="font-body-base text-body-base text-on-surface-variant max-w-md mx-auto">
                    Our AI will extract your skills and compare them to market demand.
                </p>
</div>
<!-- Drag and Drop Zone -->
<div class="w-full mt-lg mb-xl h-64 dashed-border-glow rounded-xl flex flex-col items-center justify-center cursor-pointer group relative">
<input accept=".pdf,.doc,.docx" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" type="file"/>
<div class="ai-pulse bg-surface-variant rounded-full p-md mb-md flex items-center justify-center text-secondary relative z-0">
<span class="material-symbols-outlined text-4xl" data-icon="upload_file">upload_file</span>
</div>
<span class="font-headline-md-mobile text-headline-md-mobile text-on-surface group-hover:text-secondary transition-colors z-0">
                    Upload PDF/Doc
                </span>
<span class="font-data-mono text-data-mono text-on-surface-variant mt-sm z-0">
                    Max file size: 5MB
                </span>
</div>
<!-- Action Area -->
<div class="w-full flex flex-col sm:flex-row items-center justify-center gap-md">
<button class="w-full sm:w-auto bg-[#2DD4BF] text-[#0F172A] font-body-base text-body-base font-bold py-md px-xl rounded-lg hover:brightness-110 transition-all active:scale-95 shadow-[0_0_15px_rgba(45,212,191,0.3)] flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="document_scanner">document_scanner</span>
                    Scan Resume
                </button>
</div>
</div>
<!-- Simulated Data Context (Visual Only) -->
<div class="mt-xl w-full flex items-center justify-between text-on-surface-variant font-data-mono text-data-mono opacity-50 px-md">
<span>SYS.READY</span>
<span class="flex items-center gap-xs"><span class="w-2 h-2 bg-secondary rounded-full inline-block"></span> CONNECTION_SECURE</span>
<span>v1.4.2</span>
</div>
